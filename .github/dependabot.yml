version: 2
updates:
  # Keep Dependabot security updates available without opening routine version PRs.
  # Review major/toolchain upgrades as an explicit maintenance change.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
  - package-ecosystem: pip
    directory: /services/matching-compute
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
