# urtube stack. Containers bind to localhost only; Caddy on the host
# terminates TLS for urtube.observe.tw and proxies:
#   /api/ingest/* -> 127.0.0.1:18081, everything else -> 127.0.0.1:18080
services:
  app:
    build: .
    image: urtube
    container_name: urtube-app
    # AI classification gateway runs on the host (see docs/ai-gateway.md).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:18080:3000"
    environment:
      - PORT=3000
      - DATABASE_PATH=/data/urtube.sqlite
      - USERS_DATABASE_PATH=/data/users.sqlite
    volumes:
      - urtube-data:/data
  ingest:
    build: .
    image: urtube
    container_name: urtube-ingest
    command: ["npx", "tsx", "src/ingest.ts"]
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:18081:3001"
    environment:
      - PORT=3001
      - DATABASE_PATH=/data/urtube.sqlite
      - USERS_DATABASE_PATH=/data/users.sqlite
    volumes:
      - urtube-data:/data
  worker:
    build: .
    image: urtube
    container_name: urtube-worker
    # AI classification gateway runs on the host (see docs/ai-gateway.md).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["npx", "tsx", "src/youtube-worker.ts"]
    restart: unless-stopped
    healthcheck:
      disable: true
    env_file: .env
    environment:
      - DATABASE_PATH=/data/urtube.sqlite
      - USERS_DATABASE_PATH=/data/users.sqlite
    volumes:
      - urtube-data:/data
  backup:
    build: .
    image: urtube
    container_name: urtube-backup
    command: ["npx", "tsx", "scripts/backup-worker.ts"]
    restart: unless-stopped
    healthcheck:
      disable: true
    depends_on:
      app:
        condition: service_healthy
    env_file: .env
    environment:
      - DATABASE_PATH=/data/urtube.sqlite
      - USERS_DATABASE_PATH=/data/users.sqlite
      - URTUBE_BACKUP_DIRECTORY=/backups
    volumes:
      - urtube-data:/data
      - ${URTUBE_BACKUP_HOST_DIRECTORY:-./backups}:/backups

volumes:
  urtube-data:
