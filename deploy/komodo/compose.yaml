name: komodo
services:
  mongo:
    image: mongo:8.0
    restart: unless-stopped
    command: ["--quiet", "--wiredTigerCacheSizeGB", "0.25"]
    labels:
      komodo.skip: ""
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: ${KOMODO_DATABASE_PASSWORD:?required}
    volumes:
      - mongo-data:/data/db
      - mongo-config:/data/configdb
  core:
    image: ghcr.io/moghtech/komodo-core:2.3.3
    init: true
    restart: unless-stopped
    depends_on:
      - mongo
    ports:
      - "127.0.0.1:9120:9120"
    env_file: .env
    environment:
      KOMODO_DATABASE_ADDRESS: mongo:27017
      KOMODO_DATABASE_USERNAME: admin
      KOMODO_HOST: http://localhost:19120
      KOMODO_TITLE: urtube Deployments
      KOMODO_LOCAL_AUTH: "true"
      KOMODO_DISABLE_USER_REGISTRATION: "true"
      KOMODO_DISABLE_INIT_RESOURCES: "true"
      KOMODO_RESOURCE_POLL_INTERVAL: 5-min
      TZ: Asia/Taipei
    volumes:
      - keys:/config/keys
      - backups:/backups
volumes:
  mongo-data:
  mongo-config:
  keys:
  backups:
