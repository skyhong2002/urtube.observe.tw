<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>urtube YouTube Capture settings</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="options" data-i18n-title="optionsTitle">
  <main>
    <header>
      <img class="mark" src="icon128.png" alt="">
      <div>
        <h1 data-i18n="optionsHeader">urtube YouTube Capture</h1>
        <p><span data-i18n="optionsSub">Private connection settings</span> <span id="version" class="version"></span></p>
      </div>
    </header>
    <form id="settings">
      <label for="endpoint" data-i18n="endpointLabel">Capture endpoint</label>
      <input id="endpoint" name="endpoint" type="url" required>
      <label for="token" data-i18n="tokenLabel">Capture token</label>
      <input id="token" name="token" type="password" minlength="32" autocomplete="off" required>
      <label for="google-account" data-i18n="googleAccountLabel">Google account (optional — set this when Chrome is signed into several accounts)</label>
      <input id="google-account" name="googleAccount" type="email" autocomplete="off" placeholder="you@gmail.com">
      <label class="toggle">
        <input id="enabled" name="enabled" type="checkbox">
        <span data-i18n="captureToggle">Capture viewing sessions</span>
      </label>
      <label class="toggle">
        <input id="auto-sync" name="autoSync" type="checkbox">
        <span data-i18n="dailySyncToggle">Sync account history daily</span>
      </label>
      <div class="actions">
        <button type="submit" data-i18n="save">Save</button>
        <button id="test" type="button" class="secondary" data-i18n="test">Test connection</button>
      </div>
      <p id="result" role="status"></p>
    </form>
    <p class="privacy" data-i18n="privacy">The token and pending captures stay in this Chrome profile. Daily sync reads the signed-in Google My Activity YouTube page; search terms are encrypted by urtube before storage.</p>
  </main>
  <script src="i18n.js"></script>
  <script src="options.js"></script>
</body>
</html>
