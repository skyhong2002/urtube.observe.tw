<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>urtube YouTube Capture</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="popup">
  <main>
    <header>
      <div class="mark">i</div>
      <div>
        <h1>YouTube Capture</h1>
        <p id="state">Checking status...</p>
      </div>
    </header>
    <dl>
      <div><dt>Pending</dt><dd id="pending">0</dd></div>
      <div><dt>Account sync</dt><dd id="lifelog-state">Not synced</dd></div>
      <div><dt>Last sync</dt><dd id="last-sync">Never</dd></div>
      <div><dt>History progress</dt><dd id="history-state">Not imported</dd></div>
    </dl>
    <p id="error" class="error"></p>
    <div class="actions">
      <button id="sync" type="button">Sync now</button>
      <button id="history" type="button" class="secondary">Full progress scan</button>
      <button id="options" type="button" class="secondary">Settings</button>
    </div>
  </main>
  <script src="popup.js"></script>
</body>
</html>
