<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>urtube YouTube Capture</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="popup" data-i18n-title="popupTitle">
  <main>
    <header>
      <img class="mark" src="icon128.png" alt="">
      <div>
        <h1 data-i18n="popupTitle">YouTube Capture</h1>
        <p><span id="state" data-i18n="checking">Checking status...</span> <span id="version" class="version"></span></p>
      </div>
    </header>
    <dl>
      <div><dt data-i18n="pending">Pending</dt><dd id="pending">0</dd></div>
      <div><dt data-i18n="accountSync">Account sync</dt><dd id="lifelog-state">Not synced</dd></div>
      <div><dt data-i18n="lastSync">Last sync</dt><dd id="last-sync">Never</dd></div>
      <div><dt data-i18n="historyProgress">History progress</dt><dd id="history-state">Not imported</dd></div>
    </dl>
    <p id="error" class="error"></p>
    <p id="update" hidden style="background:rgba(208,59,59,.12);border:1px solid rgba(208,59,59,.4);border-radius:8px;font-size:12px;margin:0 0 10px;padding:8px 10px"><a id="update-link" href="#" style="color:inherit"></a></p>
    <div class="actions">
      <button id="sync" type="button" data-i18n="syncNow">Sync now</button>
      <button id="history" type="button" class="secondary" data-i18n="rescanAll">Rescan all history</button>
      <button id="options" type="button" class="secondary" data-i18n="settings">Settings</button>
    </div>
    <p class="scan-help" data-i18n="scanHelp">Sync now skips only verified history. Rescan all ignores saved coverage.</p>
  </main>
  <script src="i18n.js"></script>
  <script src="popup.js"></script>
</body>
</html>
